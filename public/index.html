<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#03619F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prevozi">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png" type="image/png">
<title>Prevozi na nogomet</title>
<style>
  :root{
    --pitch:#03619F;
    --pitch-dark:#033765;
    --sage:#EAF3F8;
    --amber:#03A74E;
    --amber-dark:#037A3A;
    --chalk:#FCFEFF;
    --ink:#0E2036;
    --ink-soft:#5B7386;
    --line:#CFE0EA;
    --danger:#B3462C;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--sage);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45;
    -webkit-tap-highlight-color:transparent;
  }
  button, input{font-family:inherit;}
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 20px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 40px) calc(env(safe-area-inset-left) + 16px);
  }
  @media (max-width:380px){
    .wrap{padding-left:12px;padding-right:12px;}
    header.top h1{font-size:22px;}
    header.top .route{font-size:13px;}
  }

  header.top{
    border-bottom:2px solid var(--pitch);
    padding-bottom:16px;
    margin-bottom:22px;
    display:flex;
    align-items:center;
    gap:16px;
  }
  header.top img.badge{
    width:56px;
    height:56px;
    object-fit:contain;
    flex-shrink:0;
  }
  header.top .titles{min-width:0;}
  header.top h1{
    margin:0 0 4px;
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.01em;
    color:var(--pitch-dark);
  }
  header.top .route{
    font-size:15px;
    color:var(--ink-soft);
  }
  header.top .route b{color:var(--ink);font-weight:600;}

  .install-bar{
    margin-bottom:14px;
    background:var(--chalk);
    border:1px solid var(--pitch);
    padding:10px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .install-text{font-size:13px;font-weight:600;color:var(--ink);}
  .install-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .install-btn{
    background:var(--pitch);
    color:#fff;
    border:none;
    padding:8px 14px;
    min-height:36px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .install-btn:hover{background:var(--pitch-dark);}
  .install-dismiss{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:16px;
    padding:4px 8px;
    cursor:pointer;
    min-height:36px;
  }
  .install-ios-tip{
    margin-bottom:14px;
    background:var(--chalk);
    border:1px solid var(--line);
    padding:10px 12px;
    font-size:13px;
    color:var(--ink);
  }

  .next-ride-card{
    margin-bottom:22px;
    background:var(--pitch-dark);
    color:#fff;
    padding:16px 18px;
  }
  .next-ride-head{
    font-size:13px;
    font-weight:700;
    letter-spacing:0.02em;
    text-transform:uppercase;
    opacity:0.85;
    margin-bottom:8px;
  }
  .next-ride-driver{
    font-size:19px;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .next-ride-driver.empty{opacity:0.75;font-weight:600;}
  .next-ride-card .kids-pills{margin-top:8px;}
  .next-ride-card .kid-pill{
    background:rgba(255,255,255,0.16);
    border-color:rgba(255,255,255,0.32);
    color:#fff;
  }
  .next-ride-card .kid-pill.absent{
    background:rgba(179,70,44,0.45);
    border-color:rgba(179,70,44,0.7);
    color:#fff;
  }
  .next-ride-card .kid-pill.empty{color:rgba(255,255,255,0.75);}
  .next-ride-contact{font-size:14px;opacity:0.85;margin-top:4px;display:flex;align-items:center;gap:6px;}
  .next-ride-contact .contact-link{filter:brightness(0) invert(1);}
  .next-ride-status{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
    padding:3px 8px;
    border-radius:2px;
  }
  .next-ride-status.pending{background:rgba(255,255,255,0.18);}
  .next-ride-status.confirmed{background:var(--amber);}
  .next-ride-status.needs-replacement{background:var(--danger);}
  .next-ride-empty{font-size:15px;opacity:0.85;}

  .week-overview{
    background:var(--chalk);
    border:1px solid var(--line);
    margin-bottom:18px;
    padding:14px 16px;
  }
  .week-overview-title{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.02em;
    margin-bottom:8px;
  }
  .week-overview-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:7px 0;
    border-top:1px solid var(--line);
    flex-wrap:wrap;
  }
  .week-overview-row:first-of-type{border-top:none;}
  .week-overview-day{
    font-size:12px;
    font-weight:700;
    color:var(--pitch-dark);
    width:60px;
    flex-shrink:0;
    text-transform:uppercase;
  }
  .week-overview-driver{font-size:14px;font-weight:600;flex:1;}
  .week-overview-row.empty .week-overview-driver{color:var(--ink-soft);font-weight:500;}
  .week-overview-row .next-ride-status.pending{background:var(--line);color:var(--ink-soft);}
  .week-overview-row .next-ride-status.confirmed,
  .week-overview-row .next-ride-status.needs-replacement{color:#fff;}
  .week-counts{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--line);
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .week-count-chip{
    background:var(--sage);
    border:1px solid var(--line);
    font-size:12px;
    font-weight:600;
    color:var(--ink);
    padding:4px 10px;
    border-radius:12px;
  }

  .route-art{
    margin-bottom:22px;
    background:var(--chalk);
    border:1px solid var(--line);
    padding:14px 14px 10px;
  }
  .route-art svg{display:block;width:100%;height:auto;}
  .route-art .place{
    font-size:11px;
    font-weight:700;
    fill:var(--pitch-dark);
    letter-spacing:0.02em;
  }
  #route-car-pulse{transform-box:fill-box;transform-origin:center;}
  #route-car.live #route-car-pulse{animation:route-pulse 1.6s ease-out infinite;}
  @keyframes route-pulse{
    0%{transform:scale(0.4);opacity:0.6;}
    100%{transform:scale(2.6);opacity:0;}
  }
  .live-status{
    margin-top:10px;
    font-size:12px;
    font-weight:600;
    color:var(--amber-dark);
  }
  .share-btn{
    border:1px solid var(--amber);
    background:none;
    color:var(--amber-dark);
    font-size:13px;
    font-weight:600;
    padding:9px 14px;
    min-height:38px;
    cursor:pointer;
    white-space:nowrap;
  }
  .share-btn:hover{background:var(--amber);color:#fff;}
  .share-btn.sharing{background:var(--amber);color:#fff;}

  .ride-status-row{
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .ride-status{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    padding:5px 11px;
    border-radius:999px;
  }
  .ride-status.pending{background:var(--line);color:var(--ink-soft);}
  .ride-status.confirmed{background:var(--amber);color:#fff;}
  .ride-status.needs-replacement{background:var(--danger);color:#fff;}
  .ride-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .confirm-btn, .takeover-btn{
    background:var(--amber);
    color:#fff;
    border:none;
    padding:9px 14px;
    min-height:38px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .confirm-btn:hover, .takeover-btn:hover{background:var(--amber-dark);}
  .replace-btn{
    background:none;
    border:1px solid var(--danger);
    color:var(--danger);
    padding:9px 14px;
    min-height:38px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .replace-btn:hover{background:var(--danger);color:#fff;}

  .weeknav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
    background:var(--chalk);
    border:1px solid var(--line);
    padding:10px 14px;
  }
  .weeknav button{
    background:none;
    border:none;
    font-size:20px;
    color:var(--pitch);
    cursor:pointer;
    padding:10px 16px;
    font-weight:700;
    min-width:44px;
    min-height:44px;
  }
  .weeknav button:hover{color:var(--amber-dark);}
  .weeknav .label{font-size:14px;font-weight:600;color:var(--ink);}
  .weeknav .today-btn{
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    background:none;
    border:1px solid var(--line);
    padding:8px 12px;
    min-height:36px;
  }

  .day{
    background:var(--chalk);
    border:1px solid var(--line);
    border-left:5px solid var(--pitch);
    margin-bottom:18px;
  }
  .day.cet{border-left-color:var(--amber);}
  .day.cancelled{opacity:0.6;}

  .day-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px 10px;
  }
  .day-head .name{
    font-size:17px;
    font-weight:800;
    color:var(--pitch-dark);
  }
  .day.cet .day-head .name{color:var(--amber-dark);}
  .day-head .time{
    font-size:13px;
    color:var(--ink-soft);
  }

  .cancel-row{
    padding:0 16px 12px;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
  }
  .cancel-row input{margin:0;width:19px;height:19px;flex-shrink:0;}
  .cancel-row label{cursor:pointer;}
  .cancel-reason{
    flex:1;
    border:none;
    border-bottom:1px solid var(--line);
    background:transparent;
    font-size:13px;
    padding:2px 4px;
    color:var(--ink);
  }
  .cancel-banner{
    margin:0 16px 12px;
    background:#F6E9E4;
    border:1px solid #E3C3B6;
    color:var(--danger);
    font-size:13px;
    padding:8px 10px;
  }

  .absent-row{
    padding:0 16px 12px;
    font-size:13px;
  }
  .absent-label{color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
  .absent-choices{display:flex;gap:14px;flex-wrap:wrap;}
  .absent-choices label{
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:500;
    color:var(--ink);
    cursor:pointer;
  }
  .absent-choices input{width:19px;height:19px;flex-shrink:0;}
  .kid-absent{text-decoration:line-through;color:var(--danger);}

  .slot{
    border-top:1px solid var(--line);
    border-left:3px solid transparent;
    padding:14px 16px 16px;
  }
  .slot.dir-tja{border-left-color:var(--pitch);}
  .slot.dir-nazaj{border-left-color:var(--amber);}
  .slot-head{
    display:flex;
    align-items:center;
    gap:9px;
    margin-bottom:10px;
  }
  .dir-badge{
    width:24px;
    height:24px;
    border-radius:50%;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:700;
    color:#fff;
  }
  .dir-badge.tja{background:var(--pitch);}
  .dir-badge.nazaj{background:var(--amber);}
  .slot-title{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--ink);}
  .slot-time{flex-shrink:0;font-size:12px;color:var(--ink-soft);}

  .assigned{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .who-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .assigned .who{font-size:16px;font-weight:700;}
  .icon-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-size:14px;
    line-height:1;
    padding:0;
    width:32px;
    height:32px;
    flex-shrink:0;
    cursor:pointer;
  }
  .icon-btn:hover{border-color:var(--pitch);color:var(--pitch);}
  .icon-btn.danger:hover{border-color:var(--danger);color:var(--danger);}

  .kids-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .kid-pill{
    background:var(--sage);
    border:1px solid var(--line);
    color:var(--ink);
    font-size:12px;
    font-weight:600;
    padding:3px 10px;
    border-radius:999px;
  }
  .kid-pill.absent{
    background:#F6E9E4;
    border-color:#E3C3B6;
    color:var(--danger);
    text-decoration:line-through;
  }
  .kid-pill.empty{color:var(--ink-soft);font-weight:500;background:none;border-style:dashed;}

  .assigned .contact{font-size:12px;color:var(--ink-soft);margin-top:8px;display:flex;align-items:center;gap:6px;}
  .assigned .note{font-size:12px;color:var(--amber-dark);margin-top:6px;font-style:italic;}
  .contact-link{
    text-decoration:none;
    font-size:15px;
    line-height:1;
    padding:4px;
  }

  .signup-btn{
    border:1px solid var(--pitch);
    background:none;
    color:var(--pitch);
    font-size:13px;
    font-weight:600;
    padding:9px 14px;
    min-height:38px;
    cursor:pointer;
    white-space:nowrap;
  }
  .signup-btn:hover{background:var(--pitch);color:#fff;}

  .empty-slot{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .empty-slot .msg{display:flex;align-items:center;gap:8px;}
  .empty-slot .msg{font-size:14px;color:var(--ink-soft);}

  .form{margin-top:8px;}
  .form label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    margin:10px 0 4px;
  }
  .form input[type=text]{
    width:100%;
    padding:10px 10px;
    border:1px solid var(--line);
    background:#fff;
    font-size:16px;
    color:var(--ink);
    font-family:inherit;
  }
  .kids-choices{display:flex;gap:14px;flex-wrap:wrap;}
  .kids-choices label{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    margin:0;
    cursor:pointer;
  }
  .kids-choices input{width:19px;height:19px;flex-shrink:0;}
  .form-actions{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .save-btn{
    background:var(--pitch);
    color:#fff;
    border:none;
    padding:11px 16px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    flex:1;
  }
  .save-btn:hover{background:var(--pitch-dark);}
  .cancel-edit-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:11px 14px;
    font-size:14px;
    cursor:pointer;
    flex:1;
  }

  .status{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:26px;
  }
  .status.err{color:var(--danger);}
</style>
</head>

<script>
function fetchTimeout(url, options){
  const opts = options ? { ...options } : {};
  if(window.AbortSignal && AbortSignal.timeout){
    opts.signal = AbortSignal.timeout(10000);
  }
  return fetch(url, opts);
}

window.storage = {
  async get(key){
    const res = await fetchTimeout("/api/week?key=" + encodeURIComponent(key));
    if(!res.ok) return null;
    const data = await res.json();
    return (data && data.value != null) ? { value: data.value } : null;
  },
  async set(key, value){
    const res = await fetchTimeout("/api/week", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key, value })
    });
    return res.ok;
  }
};
</script>
<script>
const KIDS = ["Izak", "Nace", "Žak"];
const DAYS = [
  {key:"pon", name:"Ponedeljek", cls:"pon"},
  {key:"cet", name:"Četrtek", cls:"cet"}
];
const TIME = "16:00–17:00";

function mondayOf(d){
  const day = d.getDay(); // 0=Sun
  const diff = (day === 0 ? -6 : 1 - day);
  const m = new Date(d);
  m.setDate(d.getDate() + diff);
  m.setHours(0,0,0,0);
  return m;
}
function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function fmt(d){
  return d.toLocaleDateString("sl-SI", {day:"numeric", month:"numeric"});
}
function isoKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function legacyIsoKey(d){
  // pre-fix key: toISOString() converts to UTC, so for any timezone ahead
  // of UTC (e.g. Slovenia) a local-midnight Date always lands on the
  // previous UTC day. Kept only to migrate data saved under the old key.
  return d.toISOString().slice(0,10);
}

let currentMonday = mondayOf(new Date());
let editing = null; // {dayKey, slotKey}
let weekData = null;
let loading = true;
let errorMsg = "";

const ROUTE_START = { lat: 46.32472, lon: 14.92278 }; // Rečica ob Savinji
const ROUTE_END   = { lat: 46.33806, lon: 14.95722 }; // Mozirje
let sharing = null; // { dayKey, slotKey, watchId }

function haversine(a, b){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLon = toRad(b.lon - a.lon);
  const h = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function routeFraction(lat, lon){
  const total = haversine(ROUTE_START, ROUTE_END);
  const fromStart = haversine(ROUTE_START, { lat, lon });
  return Math.max(0, Math.min(1, fromStart / total));
}

function todaysDayKey(){
  const today = new Date();
  const todayMidnight = new Date(today);
  todayMidnight.setHours(0,0,0,0);
  if(isoKey(mondayOf(today)) !== isoKey(currentMonday)) return null;
  const diffDays = Math.round((todayMidnight - currentMonday) / 86400000);
  if(diffDays === 0) return "pon";
  if(diffDays === 3) return "cet";
  return null;
}

function locationKey(dayKey, slotKey){
  return "loc:" + isoKey(currentMonday) + ":" + dayKey + ":" + slotKey;
}

function getClientId(){
  try{
    let id = localStorage.getItem("clientId");
    if(!id){
      id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "-" + Math.random().toString(16).slice(2)));
      localStorage.setItem("clientId", id);
    }
    return id;
  }catch(e){ return null; }
}
function isMine(dayKey, slotKey){
  const s = weekData && weekData[dayKey] && weekData[dayKey][slotKey];
  const myId = getClientId();
  return !!s && !!s.ownerId && !!myId && s.ownerId === myId;
}

function toggleShareLocation(dayKey, slotKey){
  if(sharing && sharing.dayKey === dayKey && sharing.slotKey === slotKey){
    stopSharing();
  } else {
    startSharing(dayKey, slotKey);
  }
}

function startSharing(dayKey, slotKey){
  if(!navigator.geolocation){
    errorMsg = "Ta brskalnik ne podpira deljenja lokacije.";
    render();
    return;
  }
  if(sharing) stopSharing();
  const key = locationKey(dayKey, slotKey);
  const watchId = navigator.geolocation.watchPosition(
    pos => {
      errorMsg = "";
      postLocation(key, pos.coords.latitude, pos.coords.longitude);
    },
    (err) => {
      if(err.code === err.PERMISSION_DENIED){
        errorMsg = "Deljenje lokacije ni uspelo. Preveri dovoljenja za lokacijo.";
        stopSharing();
      } else {
        errorMsg = "Trenutno ni mogoče dobiti lokacije, poskušam znova …";
        render();
      }
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
  );
  sharing = { dayKey, slotKey, watchId };
  errorMsg = "";
  render();
}

function stopSharing(){
  if(sharing){
    navigator.geolocation.clearWatch(sharing.watchId);
    const key = locationKey(sharing.dayKey, sharing.slotKey);
    fetchTimeout("/api/location?key=" + encodeURIComponent(key), { method: "DELETE" }).catch(()=>{});
    sharing = null;
  }
  render();
}

async function postLocation(key, lat, lon){
  try{
    await fetchTimeout("/api/location", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key, lat, lon })
    });
  }catch(e){ /* transient network error while driving, next update will retry */ }
}

async function pollActiveLocation(){
  const dayKey = todaysDayKey();
  if(!dayKey || !weekData){ setCarLive(null); return; }
  const day = weekData[dayKey];
  const candidates = ["tja","nazaj"].filter(sk => day[sk] && day[sk].parent);
  if(candidates.length === 0){ setCarLive(null); return; }

  let best = null;
  for(const sk of candidates){
    try{
      const res = await fetchTimeout("/api/location?key=" + encodeURIComponent(locationKey(dayKey, sk)));
      if(!res.ok) continue;
      const data = await res.json();
      if(data && data.value){
        const loc = JSON.parse(data.value);
        if(!best || loc.ts > best.loc.ts) best = { sk, loc, parent: day[sk].parent };
      }
    }catch(e){ /* ignore, try again next poll */ }
  }
  setCarLive(best);
}

function setCarLive(info){
  const car = document.getElementById("route-car");
  const status = document.getElementById("live-status");
  const pathEl = document.getElementById("route-line");
  if(!car || !status || !pathEl) return;

  if(!info){
    car.setAttribute("transform", "translate(298,68) rotate(-16)");
    car.classList.remove("live");
    status.hidden = true;
    return;
  }

  const total = pathEl.getTotalLength();
  const frac = routeFraction(info.loc.lat, info.loc.lon);
  const p1 = pathEl.getPointAtLength(frac * total);
  const p2 = pathEl.getPointAtLength(Math.min(total, frac * total + 1));
  const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI;

  car.setAttribute("transform", `translate(${p1.x},${p1.y}) rotate(${angle})`);
  car.classList.add("live");

  const secondsAgo = Math.max(0, Math.round((Date.now() - info.loc.ts) / 1000));
  status.hidden = false;
  status.textContent = `🔴 V živo — ${info.parent} (${info.sk === "tja" ? "vožnja tja" : "vožnja nazaj"}), posodobljeno pred ${secondsAgo} s`;
}

function emptySlot(){
  return { parent:"", contact:"", kids:[true,true,true], note:"", confirmed:false, needsReplacement:false, ownerId:"" };
}
function emptyDay(){
  return { cancelled:false, cancelReason:"", absentKids:[false,false,false], tja: emptySlot(), nazaj: emptySlot() };
}
function emptyWeek(){
  return { pon: emptyDay(), cet: emptyDay() };
}

async function loadWeek(){
  loading = true; errorMsg = ""; render();
  const key = "week:" + isoKey(currentMonday);
  try{
    const res = await window.storage.get(key, true);
    weekData = (res && res.value) ? JSON.parse(res.value) : await loadLegacyWeek(key);
  }catch(e){
    if(!weekData) weekData = emptyWeek();
    errorMsg = "Nalaganje ni uspelo. Preveri povezavo in poskusi znova.";
  }
  loading = false;
  render();
}

async function loadLegacyWeek(correctKey){
  // One-time migration: before the isoKey timezone fix, weeks were saved
  // under a UTC-shifted key (see legacyIsoKey). If the correct key has
  // nothing, check the old one and copy any data found forward.
  const legacyKey = "week:" + legacyIsoKey(currentMonday);
  if(legacyKey === correctKey) return emptyWeek();
  try{
    const legacyRes = await window.storage.get(legacyKey, true);
    if(legacyRes && legacyRes.value){
      const migrated = JSON.parse(legacyRes.value);
      await window.storage.set(correctKey, JSON.stringify(migrated), true);
      return migrated;
    }
  }catch(e){ /* fall through */ }
  return emptyWeek();
}

async function saveWeek(){
  const key = "week:" + isoKey(currentMonday);
  try{
    const result = await window.storage.set(key, JSON.stringify(weekData), true);
    if(!result){ errorMsg = "Shranjevanje ni uspelo. Poskusi znova."; }
    else{ errorMsg = ""; }
  }catch(e){
    errorMsg = "Shranjevanje ni uspelo. Preveri povezavo in poskusi znova.";
  }
  render();
  refreshNextRide();
}

const SLOT_TIMES = { tja: { h: 16, m: 0, label: "Vožnja TJA" }, nazaj: { h: 17, m: 0, label: "Vožnja NAZAJ" } };

async function fetchWeekDataFor(monday){
  const correctKey = "week:" + isoKey(monday);
  try{
    const res = await fetchTimeout("/api/week?key=" + encodeURIComponent(correctKey));
    if(!res.ok) return emptyWeek();
    const data = await res.json();
    if(data && data.value) return JSON.parse(data.value);

    const legacyKey = "week:" + legacyIsoKey(monday);
    if(legacyKey === correctKey) return emptyWeek();
    const legacyRes = await fetchTimeout("/api/week?key=" + encodeURIComponent(legacyKey));
    if(!legacyRes.ok) return emptyWeek();
    const legacyData = await legacyRes.json();
    if(!legacyData || !legacyData.value) return emptyWeek();

    const migrated = JSON.parse(legacyData.value);
    fetchTimeout("/api/week", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: correctKey, value: JSON.stringify(migrated) })
    }).catch(()=>{});
    return migrated;
  }catch(e){ return emptyWeek(); }
}

async function computeNextRide(){
  const now = new Date();
  const thisMonday = mondayOf(now);
  const mondaysToCheck = [thisMonday, addDays(thisMonday, 7)];

  for(const monday of mondaysToCheck){
    const wd = (weekData && isoKey(monday) === isoKey(currentMonday))
      ? weekData
      : await fetchWeekDataFor(monday);

    for(const dayDef of DAYS){
      const day = wd[dayDef.key];
      if(day.cancelled) continue;
      const date = addDays(monday, dayDef.key === "pon" ? 0 : 3);

      for(const slotKey of ["tja","nazaj"]){
        const t = SLOT_TIMES[slotKey];
        const slotTime = new Date(date);
        slotTime.setHours(t.h, t.m, 0, 0);
        if(slotTime.getTime() > now.getTime()){
          return { dayDef, date, slotKey, slot: day[slotKey], absentKids: day.absentKids };
        }
      }
    }
  }
  return null;
}

function renderNextRide(info){
  const el = document.getElementById("next-ride");
  if(!el) return;

  if(!info){
    el.innerHTML = `<div class="next-ride-empty">Trenutno ni načrtovanih voženj.</div>`;
    return;
  }

  const { dayDef, date, slotKey, slot, absentKids } = info;
  const t = SLOT_TIMES[slotKey];
  const timeStr = String(t.h).padStart(2,"0") + ":" + String(t.m).padStart(2,"0");
  const isToday = isoKey(date) === isoKey(new Date());
  const dayLabel = isToday ? "Danes" : (dayDef.name + ", " + fmt(date));

  let body;
  if(slot && slot.parent){
    const kidsGoing = KIDS.filter((_,i)=>slot.kids[i]!==false);
    let statusClass = "pending", statusText = "ni potrjeno";
    if(slot.needsReplacement){ statusClass = "needs-replacement"; statusText = "išče zamenjavo"; }
    else if(slot.confirmed){ statusClass = "confirmed"; statusText = "potrjeno"; }
    body = `
      <div class="next-ride-driver">🚗 ${escapeHtml(slot.parent)} <span class="next-ride-status ${statusClass}">${statusText}</span></div>
      <div class="kids-pills">${kidsPillsHtml(kidsGoing, absentKids)}</div>
      ${slot.contact ? `<div class="next-ride-contact">${escapeHtml(slot.contact)} ${contactLinksHtml(slot.contact)}</div>` : ""}
    `;
  } else {
    body = `<div class="next-ride-driver empty">🚗 Še ni voznika</div>`;
  }

  el.innerHTML = `
    <div class="next-ride-head">${dayLabel} · ${timeStr} — ${t.label}</div>
    ${body}
  `;
}

async function refreshNextRide(){
  const info = await computeNextRide();
  renderNextRide(info);
}

function goWeek(offset){
  currentMonday = addDays(currentMonday, offset*7);
  editing = null;
  loadWeek();
}
function goToday(){
  currentMonday = mondayOf(new Date());
  editing = null;
  loadWeek();
}

function startEdit(dayKey, slotKey){
  editing = {dayKey, slotKey};
  render();
}
function cancelEdit(){
  editing = null;
  render();
}

function clearSlot(dayKey, slotKey){
  weekData[dayKey][slotKey] = emptySlot();
  saveWeek();
}

function toggleCancelled(dayKey, checked){
  weekData[dayKey].cancelled = checked;
  render();
}
function setCancelReason(dayKey, val){
  weekData[dayKey].cancelReason = val;
}

function toggleAbsentKid(dayKey, kidIndex, checked){
  if(!weekData[dayKey].absentKids) weekData[dayKey].absentKids = [false,false,false];
  weekData[dayKey].absentKids[kidIndex] = checked;
  saveWeek();
}

function submitForm(dayKey, slotKey){
  const parent = document.getElementById("f-parent").value.trim();
  const contact = document.getElementById("f-contact").value.trim();
  const note = document.getElementById("f-note").value.trim();
  const kids = KIDS.map((_,i) => document.getElementById("f-kid-"+i).checked);
  if(!parent){
    errorMsg = "Vpiši ime starša, ki pelje.";
    render();
    return;
  }
  weekData[dayKey][slotKey] = {
    parent, contact, kids, note,
    confirmed: false,
    needsReplacement: false,
    ownerId: getClientId()
  };
  editing = null;
  saveWeek();
}

function confirmRide(dayKey, slotKey){
  weekData[dayKey][slotKey].confirmed = true;
  weekData[dayKey][slotKey].needsReplacement = false;
  saveWeek();
}
function requestReplacement(dayKey, slotKey){
  weekData[dayKey][slotKey].confirmed = false;
  weekData[dayKey][slotKey].needsReplacement = true;
  saveWeek();
}
function cancelReplacement(dayKey, slotKey){
  weekData[dayKey][slotKey].needsReplacement = false;
  saveWeek();
}

function slotView(day, dayKey, slotKey, label, time, liveEligible){
  const s = day[slotKey];
  const isEditing = editing && editing.dayKey === dayKey && editing.slotKey === slotKey;
  const isSharingThis = sharing && sharing.dayKey === dayKey && sharing.slotKey === slotKey;

  let inner;
  if(isEditing){
    inner = `
      <div class="form">
        <label for="f-parent">Kdo pelje</label>
        <input type="text" id="f-parent" value="${escapeAttr(s.parent)}" placeholder="Ime starša">
        <label for="f-contact">Kontakt (neobvezno)</label>
        <input type="text" id="f-contact" value="${escapeAttr(s.contact)}" placeholder="npr. +386 41 234 567">
        <label>Kateri otroci gredo</label>
        <div class="kids-choices">
          ${KIDS.map((k,i)=>`<label><input type="checkbox" id="f-kid-${i}" ${s.kids[i]!==false?"checked":""}> ${k}</label>`).join("")}
        </div>
        <label for="f-note">Opomba (neobvezno — zamuda, sprememba …)</label>
        <input type="text" id="f-note" value="${escapeAttr(s.note)}" placeholder="npr. 10 min zamude">
        <div class="form-actions">
          <button class="save-btn" onclick="submitForm('${dayKey}','${slotKey}')">Shrani</button>
          <button class="cancel-edit-btn" onclick="cancelEdit()">Prekliči</button>
        </div>
      </div>
    `;
  } else if(s.parent){
    const kidsGoing = KIDS.filter((_,i)=>s.kids[i]!==false);
    const isOwner = isMine(dayKey, slotKey);

    let statusHtml;
    if(s.needsReplacement){
      statusHtml = `<div class="ride-status needs-replacement">⚠ Voznik ne more peljati — išče zamenjavo</div>`;
    } else if(s.confirmed){
      statusHtml = `<div class="ride-status confirmed">✓ Vožnja potrjena</div>`;
    } else {
      statusHtml = `<div class="ride-status pending">⚠ Voznik še ni potrdil vožnje</div>`;
    }

    let rideActions = "";
    if(isOwner){
      if(s.needsReplacement){
        rideActions = `<button class="confirm-btn" onclick="cancelReplacement('${dayKey}','${slotKey}')">Prekliči iskanje zamenjave</button>`;
      } else if(!s.confirmed){
        rideActions = `
          <button class="confirm-btn" onclick="confirmRide('${dayKey}','${slotKey}')">✓ Potrdi vožnjo</button>
          <button class="replace-btn" onclick="requestReplacement('${dayKey}','${slotKey}')">Ne morem voziti</button>
        `;
      } else {
        rideActions = `<button class="replace-btn" onclick="requestReplacement('${dayKey}','${slotKey}')">Ne morem voziti</button>`;
      }
    } else if(s.needsReplacement){
      rideActions = `<button class="takeover-btn" onclick="startEdit('${dayKey}','${slotKey}')">🙋 Prevzamem vožnjo</button>`;
    }

    if(liveEligible && isOwner){
      rideActions += `
        <button class="share-btn ${isSharingThis ? "sharing" : ""}" onclick="toggleShareLocation('${dayKey}','${slotKey}')">
          ${isSharingThis ? "⏹ Ustavi deljenje" : "📍 Deli lokacijo"}
        </button>
      `;
    }

    inner = `
      <div class="assigned">
        <div style="flex:1;min-width:0;">
          <div class="who-row">
            <span class="who">${escapeHtml(s.parent)}</span>
            <span class="icon-actions">
              <button class="icon-btn" title="Uredi" onclick="startEdit('${dayKey}','${slotKey}')">✏️</button>
              <button class="icon-btn danger" title="Izbriši" onclick="clearSlot('${dayKey}','${slotKey}')">🗑️</button>
            </span>
          </div>
          <div class="kids-pills">${kidsPillsHtml(kidsGoing, day.absentKids)}</div>
          ${s.contact ? `<div class="contact">${escapeHtml(s.contact)} ${contactLinksHtml(s.contact)}</div>` : ""}
          ${s.note ? `<div class="note">${escapeHtml(s.note)}</div>` : ""}
        </div>
      </div>
      <div class="ride-status-row">
        ${statusHtml}
        ${rideActions ? `<div class="ride-actions">${rideActions}</div>` : ""}
      </div>
    `;
  } else {
    inner = `
      <div class="empty-slot">
        <div class="msg">🚗 Še nihče ni vpisan</div>
        <button class="signup-btn" onclick="startEdit('${dayKey}','${slotKey}')">Vpiši se</button>
      </div>
    `;
  }

  const dirClass = slotKey === "tja" ? "tja" : "nazaj";
  const dirArrow = slotKey === "tja" ? "→" : "←";

  return `
    <div class="slot dir-${dirClass}">
      <div class="slot-head">
        <span class="dir-badge ${dirClass}">${dirArrow}</span>
        <div class="slot-title">${label}</div>
        <div class="slot-time">${time}</div>
      </div>
      ${inner}
    </div>
  `;
}

function dayView(dayDef, idx){
  const day = weekData[dayDef.key];
  const date = addDays(currentMonday, dayDef.key === "pon" ? 0 : 3);
  const liveEligible = todaysDayKey() === dayDef.key;
  return `
    <div class="day ${dayDef.cls} ${day.cancelled ? "cancelled" : ""}">
      <div class="day-head">
        <div class="name">${dayDef.name}, ${fmt(date)}</div>
        <div class="time">${TIME}</div>
      </div>
      <div class="cancel-row">
        <input type="checkbox" id="cancel-${dayDef.key}" ${day.cancelled?"checked":""}
          onchange="toggleCancelled('${dayDef.key}', this.checked); saveWeek();">
        <label for="cancel-${dayDef.key}">Trening ta dan odpade</label>
      </div>
      ${day.cancelled ? `
        <div class="cancel-banner">
          Trening odpade${day.cancelReason ? ": " + escapeHtml(day.cancelReason) : "."}
        </div>
      ` : ""}
      <div class="absent-row">
        <div class="absent-label">Ne gre na trening (bolezen ipd.):</div>
        <div class="absent-choices">
          ${KIDS.map((k,i) => `
            <label>
              <input type="checkbox" ${(day.absentKids && day.absentKids[i]) ? "checked" : ""}
                onchange="toggleAbsentKid('${dayDef.key}', ${i}, this.checked)">
              ${k}
            </label>
          `).join("")}
        </div>
      </div>
      ${slotView(day, dayDef.key, "tja", "Vožnja TJA", "16:00", liveEligible)}
      ${slotView(day, dayDef.key, "nazaj", "Vožnja NAZAJ", "17:00", liveEligible)}
    </div>
  `;
}

function escapeHtml(str){
  return (str||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

function kidsPillsHtml(kidsGoing, absentKids){
  if(!kidsGoing.length) return `<span class="kid-pill empty">brez otrok</span>`;
  return kidsGoing.map(k => {
    const idx = KIDS.indexOf(k);
    const isAbsent = absentKids && absentKids[idx];
    return `<span class="kid-pill${isAbsent ? " absent" : ""}">${escapeHtml(k)}</span>`;
  }).join("");
}

function phoneDigits(contact){
  const digits = (contact || "").replace(/[^\d+]/g, "");
  return digits.length >= 6 ? digits : null;
}
function contactLinksHtml(contact){
  const digits = phoneDigits(contact);
  if(!digits) return "";
  return `<a class="contact-link" href="tel:${digits}" title="Pokliči">📞</a><a class="contact-link" href="https://wa.me/${digits.replace(/^\+/,"")}" target="_blank" rel="noopener" title="WhatsApp">💬</a>`;
}

function weekOverviewHtml(){
  const rows = [];
  const counts = {};

  for(const dayDef of DAYS){
    const day = weekData[dayDef.key];
    if(day.cancelled) continue;

    for(const slotKey of ["tja","nazaj"]){
      const slot = day[slotKey];
      const dirLabel = slotKey === "tja" ? "tja" : "nazaj";

      if(slot && slot.parent){
        counts[slot.parent] = (counts[slot.parent] || 0) + 1;
        let statusClass = "pending", statusText = "ni potrjeno";
        if(slot.needsReplacement){ statusClass = "needs-replacement"; statusText = "išče zamenjavo"; }
        else if(slot.confirmed){ statusClass = "confirmed"; statusText = "potrjeno"; }
        rows.push(`
          <div class="week-overview-row">
            <div class="week-overview-day">${dayDef.name.slice(0,3)} · ${dirLabel}</div>
            <div class="week-overview-driver">${escapeHtml(slot.parent)}</div>
            <span class="next-ride-status ${statusClass}">${statusText}</span>
          </div>
        `);
      } else {
        rows.push(`
          <div class="week-overview-row empty">
            <div class="week-overview-day">${dayDef.name.slice(0,3)} · ${dirLabel}</div>
            <div class="week-overview-driver">Ni voznika</div>
          </div>
        `);
      }
    }
  }

  const counters = Object.entries(counts)
    .sort((a,b) => b[1] - a[1])
    .map(([name,n]) => `<span class="week-count-chip">${escapeHtml(name)}: ${n}×</span>`)
    .join("");

  return `
    <div class="week-overview">
      <div class="week-overview-title">Ta teden</div>
      ${rows.join("")}
      ${counters ? `<div class="week-counts">${counters}</div>` : ""}
    </div>
  `;
}

function render(){
  const content = document.getElementById("content");
  const weekEnd = addDays(currentMonday, 4);
  const isCurrentWeek = isoKey(currentMonday) === isoKey(mondayOf(new Date()));

  let html = `
    <div class="weeknav">
      <button onclick="goWeek(-1)">‹</button>
      <div class="label">${fmt(currentMonday)}–${fmt(weekEnd)}</div>
      ${isCurrentWeek ? "" : `<button class="today-btn" onclick="goToday()">Ta teden</button>`}
      <button onclick="goWeek(1)">›</button>
    </div>
  `;

  if(loading || !weekData){
    html += `<div class="status">Nalagam …</div>`;
  } else {
    html += weekOverviewHtml();
    html += DAYS.map((d,i)=>dayView(d,i)).join("");
  }
  content.innerHTML = html;

  document.getElementById("status").textContent = errorMsg;
  document.getElementById("status").className = errorMsg ? "status err" : "status";
}

loadWeek();
pollActiveLocation();
setInterval(pollActiveLocation, 6000);
refreshNextRide();
setInterval(refreshNextRide, 20000);

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/sw.js").catch(()=>{});
}

(function(){
  const bar = document.getElementById("install-bar");
  const btn = document.getElementById("install-btn");
  const dismissBtn = document.getElementById("install-dismiss");
  const iosTip = document.getElementById("install-ios-tip");
  if(!bar || !btn || !dismissBtn || !iosTip) return;

  const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  if(isStandalone) return;

  let dismissed = false;
  try{ dismissed = sessionStorage.getItem("installDismissed") === "1"; }catch(e){}
  if(dismissed) return;

  let deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    bar.hidden = false;
  });

  const ua = navigator.userAgent;
  const isIOS = /iphone|ipad|ipod/i.test(ua);
  const isSafari = /safari/i.test(ua) && !/crios|fxios|chrome/i.test(ua);
  if(isIOS && isSafari){
    bar.hidden = false;
  }

  btn.addEventListener("click", async () => {
    if(deferredPrompt){
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      bar.hidden = true;
    } else {
      iosTip.hidden = !iosTip.hidden;
    }
  });

  dismissBtn.addEventListener("click", () => {
    bar.hidden = true;
    iosTip.hidden = true;
    try{ sessionStorage.setItem("installDismissed", "1"); }catch(e){}
  });

  window.addEventListener("appinstalled", () => {
    bar.hidden = true;
  });
})();
